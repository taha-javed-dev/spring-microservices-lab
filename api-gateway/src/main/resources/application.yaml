spring:
  application:
    name: api-gateway


#api gateway config
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=2
            #- Method= GET, POST etc

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=2
            #- RedirectTo=302, http://google.com
            #- AddRequestHeader=X-Custom-Header, Taha  (add custom header)

#eureka config
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka